<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单与库存管理系统 - 云端协作版</title>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .modal { background-color: rgba(0,0,0,0.5); }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // 初始化 Supabase
        const SUPABASE_URL = 'https://ngeashwwllckspatapwt.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5nZWFzaHd3bGxja3NwYXRhcHd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1NDk4NTAsImV4cCI6MjA4OTEyNTg1MH0.0iaav1WE9CwoxSQhI_CaPjiMpBFmbG9Cv1UmWM1Y-oI';
        const supabaseDb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const App = () => {
            const [activeTab, setActiveTab] = useState('orders');
            const [isLoading, setIsLoading] = useState(true);
            
            // 状态管理：数据
            const [products, setProducts] = useState([]);
            const [customers, setCustomers] = useState([]);
            const [orders, setOrders] = useState([]);

            const [saveStatus, setSaveStatus] = useState('');
            const triggerSaveEffect = (msg = '云端数据已同步') => {
                setSaveStatus(msg);
                setTimeout(() => setSaveStatus(''), 2500);
            };

            // ================= 核心：从云端加载与实时监听 =================
            const fetchCloudData = async () => {
                try {
                    const [resP, resC, resO] = await Promise.all([
                        supabaseDb.from('products').select('*').order('id', { ascending: false }),
                        supabaseDb.from('customers').select('*').order('id', { ascending: false }),
                        supabaseDb.from('orders').select('*').order('id', { ascending: false })
                    ]);
                    if (resP.data) setProducts(resP.data);
                    if (resC.data) setCustomers(resC.data);
                    if (resO.data) setOrders(resO.data);
                } catch (error) {
                    console.error("加载数据失败", error);
                } finally {
                    setIsLoading(false);
                }
            };

            useEffect(() => {
                fetchCloudData();

                // 设置 Supabase 实时订阅，一旦数据库有任何变化，立刻拉取最新数据
                const realtimeChannel = supabaseDb.channel('cloud-sync')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, fetchCloudData)
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'customers' }, fetchCloudData)
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, fetchCloudData)
                    .subscribe();

                return () => {
                    supabaseDb.removeChannel(realtimeChannel);
                };
            }, []);

            // UI 状态
            const [showCustomerModal, setShowCustomerModal] = useState(false);
            const [editingCustomer, setEditingCustomer] = useState(null);
            const [customerForm, setCustomerForm] = useState({ name: '', phone: '', address: '' });
            const [confirmDeleteCustomer, setConfirmDeleteCustomer] = useState(false);

            const [showProductModal, setShowProductModal] = useState(false);
            const [editingProduct, setEditingProduct] = useState(null);
            const [productForm, setProductForm] = useState({ name: '', cost: '', price: '', stock: '' });
            const [confirmDeleteProduct, setConfirmDeleteProduct] = useState(false);

            const [showOrderModal, setShowOrderModal] = useState(false);
            const [editingOrder, setEditingOrder] = useState(null);
            const [orderForm, setOrderForm] = useState({ productId: '', price: '', quantity: 1, status: '待发货', customerId: '', trackingNo: '' });
            const [editingTrackingNo, setEditingTrackingNo] = useState({ id: null, value: '' });
            const [confirmDelete, setConfirmDelete] = useState(false);

            const [restockingProduct, setRestockingProduct] = useState(null);
            const [restockAmount, setRestockAmount] = useState('');
            const [showClearConfirm, setShowClearConfirm] = useState(false);

            const getCustomer = (id) => customers.find(c => c.id === id) || {};
            const getProduct = (id) => products.find(p => p.id === id) || {};

            // ================= 商品操作 =================
            const openAddProductModal = () => {
                setEditingProduct(null);
                setConfirmDeleteProduct(false);
                setProductForm({ name: '', cost: '', price: '', stock: '' });
                setShowProductModal(true);
            };

            const openEditProductModal = (product) => {
                setEditingProduct(product);
                setConfirmDeleteProduct(false);
                setProductForm({ 
                    name: product.name, cost: product.cost, price: product.price, stock: product.stock 
                });
                setShowProductModal(true);
            };

            const handleSaveProduct = async (e) => {
                e.preventDefault();
                if (editingProduct) {
                    const updated = { id: editingProduct.id, name: productForm.name, cost: Number(productForm.cost), price: Number(productForm.price), stock: Number(productForm.stock) };
                    setProducts(products.map(p => p.id === editingProduct.id ? updated : p));
                    await supabaseDb.from('products').upsert(updated);
                } else {
                    const newProduct = { id: `P${Date.now()}`, name: productForm.name, cost: Number(productForm.cost), price: Number(productForm.price), stock: Number(productForm.stock) };
                    setProducts([...products, newProduct]);
                    await supabaseDb.from('products').insert([newProduct]);
                }
                setShowProductModal(false);
                triggerSaveEffect();
            };

            const executeDeleteProduct = async () => {
                if (!editingProduct) return;
                setProducts(products.filter(p => p.id !== editingProduct.id));
                await supabaseDb.from('products').delete().eq('id', editingProduct.id);
                setShowProductModal(false);
                setConfirmDeleteProduct(false);
                triggerSaveEffect('商品已删除');
            };

            const executeRestock = async (e) => {
                e.preventDefault();
                const amount = parseInt(restockAmount);
                if (!isNaN(amount) && amount > 0) {
                    const newStock = restockingProduct.stock + amount;
                    setProducts(products.map(p => p.id === restockingProduct.id ? { ...p, stock: newStock } : p));
                    await supabaseDb.from('products').update({ stock: newStock }).eq('id', restockingProduct.id);
                    triggerSaveEffect();
                }
                setRestockingProduct(null);
                setRestockAmount('');
            };

            // ================= 收件人操作 =================
            const openAddCustomerModal = () => {
                setEditingCustomer(null);
                setConfirmDeleteCustomer(false);
                setCustomerForm({ name: '', phone: '', address: '' });
                setShowCustomerModal(true);
            };

            const openEditCustomerModal = (customer) => {
                setEditingCustomer(customer);
                setConfirmDeleteCustomer(false);
                setCustomerForm({ name: customer.name, phone: customer.phone, address: customer.address });
                setShowCustomerModal(true);
            };

            const handleSaveCustomer = async (e) => {
                e.preventDefault();
                if (editingCustomer) {
                    const updated = { id: editingCustomer.id, name: customerForm.name, phone: customerForm.phone, address: customerForm.address };
                    setCustomers(customers.map(c => c.id === editingCustomer.id ? updated : c));
                    await supabaseDb.from('customers').upsert(updated);
                } else {
                    const newCustomer = { id: `C${Date.now()}`, name: customerForm.name, phone: customerForm.phone, address: customerForm.address };
                    setCustomers([newCustomer, ...customers]);
                    await supabaseDb.from('customers').insert([newCustomer]);
                }
                setShowCustomerModal(false);
                triggerSaveEffect();
            };

            const executeDeleteCustomer = async () => {
                if (!editingCustomer) return;
                setCustomers(customers.filter(c => c.id !== editingCustomer.id));
                await supabaseDb.from('customers').delete().eq('id', editingCustomer.id);
                setShowCustomerModal(false);
                setConfirmDeleteCustomer(false);
                triggerSaveEffect('收件人已删除');
            };

            // ================= 订单操作 =================
            const openAddOrderModal = () => {
                setEditingOrder(null);
                setConfirmDelete(false);
                setOrderForm({ productId: '', price: '', quantity: 1, status: '待发货', customerId: '', trackingNo: '' });
                setShowOrderModal(true);
            };

            const openEditOrderModal = (order) => {
                setEditingOrder(order);
                setConfirmDelete(false);
                setOrderForm({ 
                    productId: order.productId, price: order.price, quantity: order.quantity, 
                    status: order.status, customerId: order.customerId, trackingNo: order.trackingNo || '' 
                });
                setShowOrderModal(true);
            };

            const handleSaveOrder = async (e) => {
                e.preventDefault();
                const newProdId = orderForm.productId;
                const newQty = Number(orderForm.quantity);
                const newProd = products.find(p => p.id === newProdId);
                
                if (!newProd) { alert('请选择商品'); return; }

                if (editingOrder) {
                    const oldProdId = editingOrder.productId;
                    const oldQty = Number(editingOrder.quantity);

                    if (oldProdId === newProdId) {
                        const diff = newQty - oldQty;
                        if (newProd.stock < diff) { alert(`库存不足！【${newProd.name}】 当前仅剩 ${newProd.stock} 件。`); return; }
                        
                        const newStock = newProd.stock - diff;
                        setProducts(products.map(p => p.id === newProdId ? { ...p, stock: newStock } : p));
                        await supabaseDb.from('products').update({ stock: newStock }).eq('id', newProdId);
                    } else {
                        if (newProd.stock < newQty) { alert(`库存不足！【${newProd.name}】 当前仅剩 ${newProd.stock} 件。`); return; }
                        
                        const oldProd = products.find(p => p.id === oldProdId);
                        const restoredStock = (oldProd ? oldProd.stock : 0) + oldQty;
                        const deductedStock = newProd.stock - newQty;

                        setProducts(products.map(p => {
                            if (p.id === oldProdId) return { ...p, stock: restoredStock }; 
                            if (p.id === newProdId) return { ...p, stock: deductedStock }; 
                            return p;
                        }));
                        
                        await supabaseDb.from('products').update({ stock: restoredStock }).eq('id', oldProdId);
                        await supabaseDb.from('products').update({ stock: deductedStock }).eq('id', newProdId);
                    }

                    const updatedOrder = {
                        ...editingOrder,
                        productId: newProdId,
                        customerId: orderForm.customerId,
                        price: Number(orderForm.price),
                        cost: newProd.cost, 
                        quantity: newQty,
                        trackingNo: orderForm.trackingNo,
                        status: (orderForm.trackingNo && orderForm.status === '待发货') ? '已发货' : orderForm.status
                    };
                    setOrders(orders.map(o => o.id === editingOrder.id ? updatedOrder : o));
                    await supabaseDb.from('orders').upsert(updatedOrder);

                } else {
                    if (newProd.stock < newQty) { alert(`库存不足！【${newProd.name}】 当前仅剩 ${newProd.stock} 件。`); return; }

                    const newStock = newProd.stock - newQty;
                    setProducts(products.map(p => p.id === newProd.id ? { ...p, stock: newStock } : p));
                    await supabaseDb.from('products').update({ stock: newStock }).eq('id', newProdId);

                    const newOrder = {
                        id: `ORD-${Date.now().toString().slice(-6)}`,
                        productId: newProdId,
                        customerId: orderForm.customerId,
                        price: Number(orderForm.price),
                        cost: newProd.cost, 
                        quantity: newQty,
                        status: orderForm.trackingNo ? '已发货' : '待发货',
                        date: new Date().toISOString().split('T')[0],
                        trackingNo: orderForm.trackingNo
                    };
                    setOrders([newOrder, ...orders]);
                    await supabaseDb.from('orders').insert([newOrder]);
                }

                setShowOrderModal(false);
                triggerSaveEffect();
            };

            const executeDeleteOrder = async () => {
                if (!editingOrder) return;
                
                const prod = products.find(p => p.id === editingOrder.productId);
                if (prod) {
                    const restoredStock = prod.stock + Number(editingOrder.quantity);
                    setProducts(products.map(p => p.id === prod.id ? { ...p, stock: restoredStock } : p));
                    await supabaseDb.from('products').update({ stock: restoredStock }).eq('id', prod.id);
                }

                setOrders(orders.filter(o => o.id !== editingOrder.id));
                await supabaseDb.from('orders').delete().eq('id', editingOrder.id);
                
                setShowOrderModal(false);
                setConfirmDelete(false);
                triggerSaveEffect('订单已删除');
            };

            const saveTrackingNo = async (id) => {
                setOrders(orders.map(o => o.id === id ? { ...o, trackingNo: editingTrackingNo.value } : o));
                await supabaseDb.from('orders').update({ trackingNo: editingTrackingNo.value }).eq('id', id);
                setEditingTrackingNo({ id: null, value: '' });
                triggerSaveEffect();
            };

            const updateOrderStatus = async (id, newStatus) => {
                setOrders(orders.map(o => o.id === id ? { ...o, status: newStatus } : o));
                await supabaseDb.from('orders').update({ status: newStatus }).eq('id', id);
                if (newStatus === '已发货') {
                    const order = orders.find(o => o.id === id);
                    setEditingTrackingNo({ id, value: order.trackingNo || '' });
                }
                triggerSaveEffect();
            };

            // ================= CSV 导出与系统重置 =================
            const convertToCSV = (headers, dataRows, filename) => {
                const BOM = '\uFEFF';
                let csvContent = headers.join(',') + '\n';
                dataRows.forEach(row => {
                    const cleanRow = row.map(field => `"${String(field !== null && field !== undefined ? field : '').replace(/"/g, '""')}"`);
                    csvContent += cleanRow.join(',') + '\n';
                });
                
                const blob = new Blob([BOM + csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = filename;
                link.click();
            };

            const exportOrders = () => {
                const headers = ['订单单号', '创建日期', '商品名称', '成交单价', '数量', '订单总额', '预估毛利', '收件人姓名', '收件人电话', '收件地址', '订单状态', '物流单号'];
                const data = orders.map(o => {
                    const prod = getProduct(o.productId);
                    const cust = getCustomer(o.customerId);
                    const cost = o.cost || prod.cost || 0;
                    return [
                        o.id, o.date, prod.name || '已删除商品', o.price, o.quantity, o.price * o.quantity, (o.price - cost) * o.quantity, 
                        cust.name || '已删除客户', cust.phone || '', cust.address || '', o.status, o.trackingNo || ''
                    ];
                });
                convertToCSV(headers, data, `订单发货报表_${new Date().toISOString().split('T')[0]}.csv`);
            };

            const exportProducts = () => {
                const headers = ['商品编号', '商品名称', '进货成本', '建议售价', '当前库存', '库存总成本'];
                const data = products.map(p => [p.id, p.name, p.cost, p.price, p.stock, p.cost * p.stock]);
                convertToCSV(headers, data, `商品与库存清单_${new Date().toISOString().split('T')[0]}.csv`);
            };

            const exportCustomers = () => {
                const headers = ['客户编号', '姓名', '联系电话', '详细收件地址', '历史下单数'];
                const data = customers.map(c => [c.id, c.name, c.phone, c.address, orders.filter(o => o.customerId === c.id).length]);
                convertToCSV(headers, data, `收件人地址簿_${new Date().toISOString().split('T')[0]}.csv`);
            };

            const executeClearAllData = async () => {
                setProducts([]); setCustomers([]); setOrders([]);
                
                // 从云端彻底删除所有数据
                await Promise.all([
                    supabaseDb.from('orders').delete().not('id', 'is', null),
                    supabaseDb.from('products').delete().not('id', 'is', null),
                    supabaseDb.from('customers').delete().not('id', 'is', null)
                ]);

                setShowClearConfirm(false);
                triggerSaveEffect('云端数据已全部清空！');
            };

            // 数据统计
            const totalRevenue = orders.reduce((sum, o) => sum + (o.price * o.quantity), 0);
            const totalProfit = orders.reduce((sum, o) => sum + ((o.price - (o.cost || getProduct(o.productId).cost || 0)) * o.quantity), 0);
            const pendingShipments = orders.filter(o => o.status === '待发货').length;
            const lowStockCount = products.filter(p => p.stock < 10).length;
            const totalInventoryValue = products.reduce((sum, p) => sum + (p.cost * p.stock), 0);

            // 如果正在从云端加载初始数据
            if (isLoading) {
                return (
                    <div className="flex h-screen w-screen items-center justify-center bg-gray-100 flex-col">
                        <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mb-4"></div>
                        <h2 className="text-gray-600 font-medium">正在连接云端数据库...</h2>
                        <p className="text-sm text-gray-400 mt-2">请确保您已在 Supabase 运行了建表 SQL</p>
                    </div>
                );
            }

            return (
                <div className="flex h-screen bg-gray-100">
                    <div className="w-64 bg-white shadow-lg flex flex-col relative z-20">
                        <div className="p-6 border-b">
                            <h1 className="text-xl font-bold text-indigo-600"><i className="fas fa-cloud mr-2"></i>云端订单系统</h1>
                        </div>
                        <nav className="flex-1 p-4 space-y-2 overflow-y-auto">
                            <button onClick={() => setActiveTab('dashboard')} className={`w-full text-left px-4 py-3 rounded-lg flex items-center transition ${activeTab === 'dashboard' ? 'bg-indigo-50 text-indigo-600 font-medium' : 'text-gray-600 hover:bg-gray-50'}`}>
                                <i className="fas fa-chart-pie w-6"></i> 财务与概览
                            </button>
                            <button onClick={() => setActiveTab('products')} className={`w-full text-left px-4 py-3 rounded-lg flex items-center transition ${activeTab === 'products' ? 'bg-indigo-50 text-indigo-600 font-medium' : 'text-gray-600 hover:bg-gray-50'}`}>
                                <i className="fas fa-boxes w-6"></i> 商品与库存
                            </button>
                            <button onClick={() => setActiveTab('orders')} className={`w-full text-left px-4 py-3 rounded-lg flex items-center transition ${activeTab === 'orders' ? 'bg-indigo-50 text-indigo-600 font-medium' : 'text-gray-600 hover:bg-gray-50'}`}>
                                <i className="fas fa-shopping-cart w-6"></i> 订单与发货
                            </button>
                            <button onClick={() => setActiveTab('customers')} className={`w-full text-left px-4 py-3 rounded-lg flex items-center transition ${activeTab === 'customers' ? 'bg-indigo-50 text-indigo-600 font-medium' : 'text-gray-600 hover:bg-gray-50'}`}>
                                <i className="fas fa-users w-6"></i> 收件人地址
                            </button>
                            <div className="pt-4 mt-2 border-t border-gray-100">
                                <button onClick={() => setActiveTab('export')} className={`w-full text-left px-4 py-3 rounded-lg flex items-center transition ${activeTab === 'export' ? 'bg-green-50 text-green-700 font-medium' : 'text-gray-600 hover:bg-gray-50'}`}>
                                    <i className="fas fa-database w-6"></i> 数据导出与重置
                                </button>
                            </div>
                        </nav>
                    </div>

                    <div className="flex-1 flex flex-col h-screen overflow-hidden relative">
                        <div className={`absolute top-4 right-1/2 translate-x-1/2 bg-green-100 text-green-700 px-4 py-2 rounded-full text-sm font-medium shadow-sm transition-all duration-500 z-50 flex items-center ${saveStatus ? 'opacity-100 transform translate-y-0' : 'opacity-0 transform -translate-y-4 pointer-events-none'}`}>
                            <i className="fas fa-cloud-upload-alt mr-2"></i> {saveStatus}
                        </div>

                        <header className="bg-white shadow-sm p-4 flex justify-between items-center z-10 shrink-0">
                            <h2 className="text-xl font-semibold text-gray-800">
                                {activeTab === 'dashboard' && '财务与经营概览'}
                                {activeTab === 'products' && '商品管理'}
                                {activeTab === 'orders' && '订单发货与物流管理'}
                                {activeTab === 'customers' && '收件人地址簿'}
                                {activeTab === 'export' && '云端数据导出与管理'}
                            </h2>
                            <div className="text-xs text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-full border border-indigo-200 flex items-center">
                                <span className="relative flex h-2 w-2 mr-2">
                                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                                  <span className="relative inline-flex rounded-full h-2 w-2 bg-indigo-500"></span>
                                </span>
                                Supabase 实时协作已连接
                            </div>
                        </header>

                        <main className="p-6 flex-1 overflow-auto">
                            {/* Dashboard */}
                            {activeTab === 'dashboard' && (
                                <div className="space-y-6">
                                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center">
                                            <div className="rounded-full bg-blue-100 p-4 mr-4"><i className="fas fa-wallet text-blue-600 text-xl"></i></div>
                                            <div><p className="text-sm text-gray-500 mb-1">总销售额</p><p className="text-2xl font-bold text-gray-800">¥{totalRevenue.toLocaleString()}</p></div>
                                        </div>
                                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center">
                                            <div className="rounded-full bg-green-100 p-4 mr-4"><i className="fas fa-chart-line text-green-600 text-xl"></i></div>
                                            <div><p className="text-sm text-gray-500 mb-1">预估毛利</p><p className="text-2xl font-bold text-green-600">¥{totalProfit.toLocaleString()}</p></div>
                                        </div>
                                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center">
                                            <div className="rounded-full bg-orange-100 p-4 mr-4"><i className="fas fa-shipping-fast text-orange-600 text-xl"></i></div>
                                            <div><p className="text-sm text-gray-500 mb-1">待发货订单</p><p className="text-2xl font-bold text-gray-800">{pendingShipments} 单</p></div>
                                        </div>
                                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center">
                                            <div className="rounded-full bg-red-100 p-4 mr-4"><i className="fas fa-exclamation-triangle text-red-600 text-xl"></i></div>
                                            <div><p className="text-sm text-gray-500 mb-1">库存预警</p><p className="text-2xl font-bold text-red-600">{lowStockCount} 款</p></div>
                                        </div>
                                    </div>
                                    <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                                        <h3 className="text-lg font-medium text-gray-800 mb-4">库存资产状态</h3>
                                        <div className="flex justify-between items-center bg-gray-50 p-4 rounded-lg">
                                            <div><p className="text-sm text-gray-500">当前库存总成本占用</p><p className="text-xl font-bold text-gray-800 mt-1">¥{totalInventoryValue.toLocaleString()}</p></div>

                                <form onSubmit={executeRestock}>
                                    <input type="number" min="1" autoFocus required className="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none mb-5" placeholder="请输入本次入库的件数" value={restockAmount} onChange={e => setRestockAmount(e.target.value)} />
                                    <div className="flex justify-end space-x-3"><button type="button" onClick={() => setRestockingProduct(null)} className="px-4 py-2 border border-gray-300 rounded-lg text-sm text-gray-700 hover:bg-gray-50 transition">取消</button><button type="submit" className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700 transition">确认入库</button></div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Order Modal */}
                    {showOrderModal && (
                        <div className="fixed inset-0 modal flex items-center justify-center z-[100] p-4">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-lg p-6">
                                <div className="flex justify-between items-center mb-5">
                                    <h3 className="text-lg font-bold text-gray-800">{editingOrder ? `编辑订单 (${editingOrder.id})` : '新建订单与发货'}</h3>
                                    <button type="button" onClick={() => setShowOrderModal(false)} className="text-gray-400 hover:text-gray-600"><i className="fas fa-times"></i></button>
                                </div>
                                <form onSubmit={handleSaveOrder} className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">选择商品</label>
                                        <select required className="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" value={orderForm.productId} onChange={(e) => { const prod = products.find(p => p.id === e.target.value); setOrderForm({ ...orderForm, productId: e.target.value, price: prod ? prod.price : orderForm.price }); }}>
                                            <option value="">-- 请选择出库商品 --</option>
                                            {products.map(p => (<option key={p.id} value={p.id} disabled={p.stock === 0 && (!editingOrder || editingOrder.productId !== p.id)}>{p.name} (当前库存: {p.stock}) {p.stock === 0 ? '- 已售罄' : ''}</option>))}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">选择收件人</label>
                                        <select required className="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" value={orderForm.customerId} onChange={(e) => setOrderForm({...orderForm, customerId: e.target.value})}>
                                            <option value="">-- 请选择收件人 --</option>
                                            {customers.map(c => <option key={c.id} value={c.id}>{c.name} ({c.phone})</option>)}
                                        </select>
                                    </div>
                                    <div className="flex space-x-4">
                                        <div className="flex-1"><label className="block text-sm font-medium text-gray-700 mb-1">实际成交单价 (¥)</label><input required type="number" min="0" step="0.01" className="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" value={orderForm.price} onChange={(e) => setOrderForm({...orderForm, price: e.target.value})} /></div>
                                        <div className="flex-1"><label className="block text-sm font-medium text-gray-700 mb-1">发货数量</label><input required type="number" min="1" className="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" value={orderForm.quantity} onChange={(e) => setOrderForm({...orderForm, quantity: e.target.value})} /></div>
                                    </div>
                                    
                                    {editingOrder && (
                                        <div className="flex space-x-4">
                                            <div className="flex-1"><label className="block text-sm font-medium text-gray-700 mb-1">订单状态</label><select className="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" value={orderForm.status} onChange={(e) => setOrderForm({...orderForm, status: e.target.value})}><option value="待发货">待发货</option><option value="已发货">已发货</option><option value="已退款">已退款</option></select></div>
                                            <div className="flex-1"><label className="block text-sm font-medium text-gray-700 mb-1">快递单号 (选填)</label><input type="text" className="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="物流单号" value={orderForm.trackingNo} onChange={(e) => setOrderForm({...orderForm, trackingNo: e.target.value})} /></div>
                                        </div>
                                    )}

                                    <div className={`pt-4 flex ${editingOrder ? 'justify-between' : 'justify-end'} items-center mt-2`}>
                                        {editingOrder && (
                                            confirmDelete ? (
                                                <div className="flex items-center bg-red-50 p-1.5 rounded-lg border border-red-100 mr-2"><span className="text-xs text-red-600 font-medium mx-2"><i className="fas fa-exclamation-circle mr-1"></i>确认删除并退库存？</span><button type="button" onClick={executeDeleteOrder} className="bg-red-500 text-white px-3 py-1.5 rounded text-xs hover:bg-red-600 shadow-sm transition">确认</button><button type="button" onClick={() => setConfirmDelete(false)} className="text-gray-500 px-3 py-1.5 text-xs hover:bg-gray-200 rounded ml-1 transition">取消</button></div>
                                            ) : (<button type="button" onClick={() => setConfirmDelete(true)} className="text-red-500 hover:text-white hover:bg-red-500 border border-red-200 px-3 py-2 rounded-lg text-sm flex items-center transition shrink-0"><i className="fas fa-trash-alt mr-1"></i> 彻底删除</button>)
                                        )}
                                        <div className="flex space-x-3 shrink-0"><button type="button" onClick={() => setShowOrderModal(false)} className="px-5 py-2.5 border border-gray-300 rounded-lg text-sm text-gray-700 hover:bg-gray-50 font-medium transition">取消</button><button type="submit" className="px-5 py-2.5 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700 font-medium transition">{editingOrder ? '保存修改' : '生成订单并扣库存'}</button></div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
