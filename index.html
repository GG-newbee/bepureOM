<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>云端订单系统</title>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            -webkit-tap-highlight-color: transparent; /* 移除手机点击的高亮底色 */
        }
        .modal { background-color: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
        
        /* 隐藏滚动条但保留滚动功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 手机端底部安全区适配 */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // 初始化 Supabase
        const SUPABASE_URL = 'https://ngeashwwllckspatapwt.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5nZWFzaHd3bGxja3NwYXRhcHd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1NDk4NTAsImV4cCI6MjA4OTEyNTg1MH0.0iaav1WE9CwoxSQhI_CaPjiMpBFmbG9Cv1UmWM1Y-oI';
        const supabaseDb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const App = () => {
            // 默认展示 dashboard
            const [activeTab, setActiveTab] = useState('orders'); // 改为默认显示订单页
            const [isLoading, setIsLoading] = useState(true);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            
            // 状态管理：隐私模式 (小眼睛开关)
            const [isPrivacyMode, setIsPrivacyMode] = useState(() => {
                return localStorage.getItem('oms_privacy') === 'true';
            });
            // 状态管理：当前默认开单人姓名
            const [defaultSeller, setDefaultSeller] = useState(() => {
                return localStorage.getItem('oms_seller_name') || '';
            });

            // 监听状态变化并保存到本地
            useEffect(() => { localStorage.setItem('oms_privacy', isPrivacyMode); }, [isPrivacyMode]);
            useEffect(() => { localStorage.setItem('oms_seller_name', defaultSeller); }, [defaultSeller]);
            
            // 状态管理：数据
            const [products, setProducts] = useState([]);
            const [customers, setCustomers] = useState([]);
            const [orders, setOrders] = useState([]);

            // ================= 新增：高级排序与过滤状态 =================
            const [orderFilter, setOrderFilter] = useState('全部订单');
            // 支持三种排序：'默认' (按时间新到旧), '优先待发货', '优先未收款'
            const [orderSortBy, setOrderSortBy] = useState('默认');

            const [saveStatus, setSaveStatus] = useState('');
            const triggerSaveEffect = (msg = '云端数据已同步') => {
                setSaveStatus(msg);
                setTimeout(() => setSaveStatus(''), 2500);
            };

            // 切换 Tab 时自动收起手机菜单
            const handleTabChange = (tab) => {
                setActiveTab(tab);
                setIsMobileMenuOpen(false);
                window.scrollTo(0, 0);
            };

            // ================= 核心：从云端加载与实时监听 =================
            const fetchCloudData = async () => {
                try {
                    const [resP, resC, resO] = await Promise.all([
                        supabaseDb.from('products').select('*').order('id', { ascending: false }),
                        supabaseDb.from('customers').select('*').order('id', { ascending: false }),
                        supabaseDb.from('orders').select('*').order('id', { ascending: false })
                    ]);
                    if (resP.data) setProducts(resP.data);
                    if (resC.data) setCustomers(resC.data);
                    if (resO.data) {
                        const processedOrders = resO.data.map(o => ({
                            ...o,
                            paymentStatus: o.paymentStatus || '未收款',
                            seller: o.seller || '未填写'
                        }));
                        setOrders(processedOrders);
                    }
                } catch (error) {
                    console.error("加载数据失败", error);
                } finally {
                    setIsLoading(false);
                }
            };

            useEffect(() => {
                fetchCloudData();
                const realtimeChannel = supabaseDb.channel('cloud-sync')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, fetchCloudData)
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'customers' }, fetchCloudData)
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, fetchCloudData)
                    .subscribe();

                return () => supabaseDb.removeChannel(realtimeChannel);
            }, []);

            // UI 状态
            const [showCustomerModal, setShowCustomerModal] = useState(false);
            const [editingCustomer, setEditingCustomer] = useState(null);
            const [customerForm, setCustomerForm] = useState({ name: '', phone: '', address: '' });
            const [confirmDeleteCustomer, setConfirmDeleteCustomer] = useState(false);

            const [showProductModal, setShowProductModal] = useState(false);
            const [editingProduct, setEditingProduct] = useState(null);
            const [productForm, setProductForm] = useState({ name: '', cost: '', price: '', stock: '' });
            const [confirmDeleteProduct, setConfirmDeleteProduct] = useState(false);

            const [showOrderModal, setShowOrderModal] = useState(false);
            const [editingOrder, setEditingOrder] = useState(null);
            const [orderForm, setOrderForm] = useState({ productId: '', price: '', quantity: 1, status: '待发货', paymentStatus: '未收款', customerId: '', trackingNo: '', seller: defaultSeller });
            const [editingTrackingNo, setEditingTrackingNo] = useState({ id: null, value: '' });
            const [confirmDelete, setConfirmDelete] = useState(false);

            const [restockingProduct, setRestockingProduct] = useState(null);
            const [restockAmount, setRestockAmount] = useState('');
            const [showClearConfirm, setShowClearConfirm] = useState(false);

            const getCustomer = (id) => customers.find(c => c.id === id) || {};
            const getProduct = (id) => products.find(p => p.id === id) || {};

            // ================= 隐私掩码组件 =================
            const PrivacyText = ({ text, isMoney = false }) => {
                if (!isPrivacyMode) return <span>{isMoney ? `¥${text.toLocaleString()}` : text}</span>;
                return <span className="font-mono tracking-widest opacity-40">***</span>;
            };

            // ================= 商品操作 =================
            const openAddProductModal = () => {
                setEditingProduct(null); setConfirmDeleteProduct(false); setProductForm({ name: '', cost: '', price: '', stock: '' }); setShowProductModal(true);
            };

            const openEditProductModal = (product) => {
                setEditingProduct(product); setConfirmDeleteProduct(false); setProductForm({ name: product.name, cost: product.cost, price: product.price, stock: product.stock }); setShowProductModal(true);
            };

            const handleSaveProduct = async (e) => {
                e.preventDefault();
                if (editingProduct) {
                    const updated = { id: editingProduct.id, name: productForm.name, cost: Number(productForm.cost), price: Number(productForm.price), stock: Number(productForm.stock) };
                    setProducts(products.map(p => p.id === editingProduct.id ? updated : p));
                    await supabaseDb.from('products').upsert(updated);
                } else {
                    const newProduct = { id: `P${Date.now()}`, name: productForm.name, cost: Number(productForm.cost), price: Number(productForm.price), stock: Number(productForm.stock) };
                    setProducts([...products, newProduct]);
                    await supabaseDb.from('products').insert([newProduct]);
                }
                setShowProductModal(false); triggerSaveEffect();
            };

            const executeDeleteProduct = async () => {
                if (!editingProduct) return;
                setProducts(products.filter(p => p.id !== editingProduct.id));
                await supabaseDb.from('products').delete().eq('id', editingProduct.id);
                setShowProductModal(false); setConfirmDeleteProduct(false); triggerSaveEffect('商品已删除');
            };

            const executeRestock = async (e) => {
                e.preventDefault();
                const amount = parseInt(restockAmount);
                if (!isNaN(amount) && amount > 0) {
                    const newStock = restockingProduct.stock + amount;
                    setProducts(products.map(p => p.id === restockingProduct.id ? { ...p, stock: newStock } : p));
                    await supabaseDb.from('products').update({ stock: newStock }).eq('id', restockingProduct.id);
                    triggerSaveEffect();
                }
                setRestockingProduct(null); setRestockAmount('');
            };

            // ================= 收件人操作 =================
            const openAddCustomerModal = () => {
                setEditingCustomer(null); setConfirmDeleteCustomer(false); setCustomerForm({ name: '', phone: '', address: '' }); setShowCustomerModal(true);
            };

            const openEditCustomerModal = (customer) => {
                setEditingCustomer(customer); setConfirmDeleteCustomer(false); setCustomerForm({ name: customer.name, phone: customer.phone, address: customer.address }); setShowCustomerModal(true);
            };

            const handleSaveCustomer = async (e) => {
                e.preventDefault();
                if (editingCustomer) {
                    const updated = { id: editingCustomer.id, name: customerForm.name, phone: customerForm.phone, address: customerForm.address };
                    setCustomers(customers.map(c => c.id === editingCustomer.id ? updated : c));
                    await supabaseDb.from('customers').upsert(updated);
                } else {
                    const newCustomer = { id: `C${Date.now()}`, name: customerForm.name, phone: customerForm.phone, address: customerForm.address };
                    setCustomers([newCustomer, ...customers]);
                    await supabaseDb.from('customers').insert([newCustomer]);
                }
                setShowCustomerModal(false); triggerSaveEffect();
            };

            const executeDeleteCustomer = async () => {
                if (!editingCustomer) return;
                setCustomers(customers.filter(c => c.id !== editingCustomer.id));
                await supabaseDb.from('customers').delete().eq('id', editingCustomer.id);
                setShowCustomerModal(false); setConfirmDeleteCustomer(false); triggerSaveEffect('收件人已删除');
            };

            // ================= 订单操作 =================
            const openAddOrderModal = () => {
                setEditingOrder(null); setConfirmDelete(false); 
                setOrderForm({ productId: '', price: '', quantity: 1, status: '待发货', paymentStatus: '未收款', customerId: '', trackingNo: '', seller: defaultSeller }); 
                setShowOrderModal(true);
            };

            const openEditOrderModal = (order) => {
                setEditingOrder(order); setConfirmDelete(false); 
                setOrderForm({ productId: order.productId, price: order.price, quantity: order.quantity, status: order.status, paymentStatus: order.paymentStatus || '未收款', customerId: order.customerId, trackingNo: order.trackingNo || '', seller: order.seller || defaultSeller }); 
                setShowOrderModal(true);
            };

            const handleSaveOrder = async (e) => {
                e.preventDefault();
                
                // 如果用户输入了开单人，且和当前默认开单人不同，自动更新默认开单人
                if (orderForm.seller && orderForm.seller !== defaultSeller) {
                    setDefaultSeller(orderForm.seller);
                }

                const newProdId = orderForm.productId; const newQty = Number(orderForm.quantity); const newProd = products.find(p => p.id === newProdId);
                if (!newProd) { alert('请选择商品'); return; }

                if (editingOrder) {
                    const oldProdId = editingOrder.productId; const oldQty = Number(editingOrder.quantity);
                    if (oldProdId === newProdId) {
                        const diff = newQty - oldQty;
                        if (newProd.stock < diff) { alert(`库存不足！【${newProd.name}】 当前仅剩 ${newProd.stock} 件。`); return; }
                        const newStock = newProd.stock - diff;
                        setProducts(products.map(p => p.id === newProdId ? { ...p, stock: newStock } : p));
                        await supabaseDb.from('products').update({ stock: newStock }).eq('id', newProdId);
                    } else {
                        if (newProd.stock < newQty) { alert(`库存不足！【${newProd.name}】 当前仅剩 ${newProd.stock} 件。`); return; }
                        const oldProd = products.find(p => p.id === oldProdId);
                        const restoredStock = (oldProd ? oldProd.stock : 0) + oldQty;
                        const deductedStock = newProd.stock - newQty;
                        setProducts(products.map(p => { if (p.id === oldProdId) return { ...p, stock: restoredStock }; if (p.id === newProdId) return { ...p, stock: deductedStock }; return p; }));
                        await supabaseDb.from('products').update({ stock: restoredStock }).eq('id', oldProdId);
                        await supabaseDb.from('products').update({ stock: deductedStock }).eq('id', newProdId);
                    }
                    const updatedOrder = { ...editingOrder, productId: newProdId, customerId: orderForm.customerId, price: Number(orderForm.price), cost: newProd.cost, quantity: newQty, trackingNo: orderForm.trackingNo, status: (orderForm.trackingNo && orderForm.status === '待发货') ? '已发货' : orderForm.status, paymentStatus: orderForm.paymentStatus, seller: orderForm.seller };
                    setOrders(orders.map(o => o.id === editingOrder.id ? updatedOrder : o));
                    await supabaseDb.from('orders').upsert(updatedOrder);
                } else {
                    if (newProd.stock < newQty) { alert(`库存不足！【${newProd.name}】 当前仅剩 ${newProd.stock} 件。`); return; }
                    const newStock = newProd.stock - newQty;
                    setProducts(products.map(p => p.id === newProd.id ? { ...p, stock: newStock } : p));
                    await supabaseDb.from('products').update({ stock: newStock }).eq('id', newProdId);
                    const newOrder = { id: `ORD-${Date.now().toString().slice(-6)}`, productId: newProdId, customerId: orderForm.customerId, price: Number(orderForm.price), cost: newProd.cost, quantity: newQty, status: orderForm.trackingNo ? '已发货' : '待发货', paymentStatus: orderForm.paymentStatus, seller: orderForm.seller, date: new Date().toISOString().split('T')[0], trackingNo: orderForm.trackingNo };
                    setOrders([newOrder, ...orders]);
                    await supabaseDb.from('orders').insert([newOrder]);
                }
                setShowOrderModal(false); triggerSaveEffect();
            };

            const executeDeleteOrder = async () => {
                if (!editingOrder) return;
                const prod = products.find(p => p.id === editingOrder.productId);
                if (prod) {
                    const restoredStock = prod.stock + Number(editingOrder.quantity);
                    setProducts(products.map(p => p.id === prod.id ? { ...p, stock: restoredStock } : p));
                    await supabaseDb.from('products').update({ stock: restoredStock }).eq('id', prod.id);
                }
                setOrders(orders.filter(o => o.id !== editingOrder.id));
                await supabaseDb.from('orders').delete().eq('id', editingOrder.id);
                setShowOrderModal(false); setConfirmDelete(false); triggerSaveEffect('订单已删除');
            };

            const saveTrackingNo = async (id) => {
                setOrders(orders.map(o => o.id === id ? { ...o, trackingNo: editingTrackingNo.value } : o));
                await supabaseDb.from('orders').update({ trackingNo: editingTrackingNo.value }).eq('id', id);
                setEditingTrackingNo({ id: null, value: '' }); triggerSaveEffect();
            };

            const updateOrderStatus = async (id, newStatus) => {
                setOrders(orders.map(o => o.id === id ? { ...o, status: newStatus } : o));
                await supabaseDb.from('orders').update({ status: newStatus }).eq('id', id);
                if (newStatus === '已发货') {
                    const order = orders.find(o => o.id === id);
                    setEditingTrackingNo({ id, value: order.trackingNo || '' });
                }
                triggerSaveEffect();
            };

            const togglePaymentStatus = async (id, currentStatus) => {
                const newStatus = currentStatus === '已收款' ? '未收款' : '已收款';
                setOrders(orders.map(o => o.id === id ? { ...o, paymentStatus: newStatus } : o));
                await supabaseDb.from('orders').update({ paymentStatus: newStatus }).eq('id', id);
                triggerSaveEffect();
            };

            // ================= 导出与重置操作 =================
            const convertToCSV = (headers, dataRows, filename) => {
                const BOM = '\uFEFF';
                let csvContent = headers.join(',') + '\n';
                dataRows.forEach(row => {
                    const cleanRow = row.map(field => `"${String(field !== null && field !== undefined ? field : '').replace(/"/g, '""')}"`);
                    csvContent += cleanRow.join(',') + '\n';
                });
                
                const blob = new Blob([BOM + csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = filename;
                link.click();
            };

            const exportOrders = () => {
                const headers = ['订单单号', '创建日期', '开单人', '商品名称', '成交单价', '数量', '订单总额', '预估毛利', '收件人姓名', '收件人电话', '收件地址', '发货状态', '收款状态', '物流单号'];
                const data = orders.map(o => {
                    const prod = getProduct(o.productId);
                    const cust = getCustomer(o.customerId);
                    const cost = o.cost || prod.cost || 0;
                    return [
                        o.id, o.date, o.seller || '', prod.name || '已删除商品', o.price, o.quantity, o.price * o.quantity, (o.price - cost) * o.quantity, 
                        cust.name || '已删除客户', cust.phone || '', cust.address || '', o.status, o.paymentStatus, o.trackingNo || ''
                    ];
                });
                convertToCSV(headers, data, `订单发货报表_${new Date().toISOString().split('T')[0]}.csv`);
            };

            const exportProducts = () => {
                const headers = ['商品编号', '商品名称', '进货成本', '建议售价', '当前库存', '库存总成本'];
                const data = products.map(p => [p.id, p.name, p.cost, p.price, p.stock, p.cost * p.stock]);
                convertToCSV(headers, data, `商品与库存清单_${new Date().toISOString().split('T')[0]}.csv`);
            };

            const exportCustomers = () => {
                const headers = ['客户编号', '姓名', '联系电话', '详细收件地址', '历史下单数'];
                const data = customers.map(c => [c.id, c.name, c.phone, c.address, orders.filter(o => o.customerId === c.id).length]);
                convertToCSV(headers, data, `收件人地址簿_${new Date().toISOString().split('T')[0]}.csv`);
            };

            const executeClearAllData = async () => {
                setProducts([]); setCustomers([]); setOrders([]);
                await Promise.all([ supabaseDb.from('orders').delete().not('id', 'is', null), supabaseDb.from('products').delete().not('id', 'is', null), supabaseDb.from('customers').delete().not('id', 'is', null) ]);
                setShowClearConfirm(false); triggerSaveEffect('云端数据已全部清空！');
            };

            // 数据统计
            const totalRevenue = orders.reduce((sum, o) => sum + (o.price * o.quantity), 0);
            const totalProfit = orders.reduce((sum, o) => sum + ((o.price - (o.cost || getProduct(o.productId).cost || 0)) * o.quantity), 0);
            const pendingPaymentsAmount = orders.filter(o => o.paymentStatus !== '已收款').reduce((sum, o) => sum + (o.price * o.quantity), 0);
            const pendingShipments = orders.filter(o => o.status === '待发货').length;
            const lowStockCount = products.filter(p => p.stock < 10).length;

            // ================= 订单【排序+过滤】复合逻辑 =================
            const filteredAndSortedOrders = useMemo(() => {
                // 1. 先过滤
                let result = orders;
                if (orderFilter === '待发货') result = orders.filter(o => o.status === '待发货');
                if (orderFilter === '未收款') result = orders.filter(o => o.paymentStatus !== '已收款');
                
                // 2. 再排序 (为了不改变原始数据，这里做个浅拷贝再排序)
                result = [...result];
                
                if (orderSortBy === '优先待发货') {
                    // 把 "待发货" 的单子排到前面，如果状态一样，再按时间倒序
                    result.sort((a, b) => {
                        if (a.status === '待发货' && b.status !== '待发货') return -1;
                        if (a.status !== '待发货' && b.status === '待发货') return 1;
                        // 状态相同时，由于 id 包含了时间戳信息（ORD-xxx），可以用 id 字符串反向比较来保证最新的在上面
                        return b.id.localeCompare(a.id);
                    });
                } else if (orderSortBy === '优先未收款') {
                    // 把 "未收款" 的单子排到前面，如果状态一样，再按时间倒序
                    result.sort((a, b) => {
                        const aUnpaid = a.paymentStatus !== '已收款';
                        const bUnpaid = b.paymentStatus !== '已收款';
                        if (aUnpaid && !bUnpaid) return -1;
                        if (!aUnpaid && bUnpaid) return 1;
                        return b.id.localeCompare(a.id);
                    });
                } else {
                    // 默认排序：只按时间（id）倒序，保证最新创建的在最上面
                    result.sort((a, b) => b.id.localeCompare(a.id));
                }
                
                return result;
            }, [orders, orderFilter, orderSortBy]);

            if (isLoading) {
                return (
                    <div className="flex h-screen w-screen items-center justify-center bg-gray-50 flex-col">
                        <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600 mb-4"></div>
                        <h2 className="text-gray-600 font-medium">正在连接云端...</h2>
                    </div>
                );
            }

            return (
                <div className="flex flex-col md:flex-row h-screen bg-gray-50">
                    
                    {/* 移动端顶部导航栏 */}
                    <div className="md:hidden bg-white shadow-sm flex justify-between items-center p-4 z-30 relative">
                        <h1 className="text-lg font-bold text-indigo-600 truncate"><i className="fas fa-cloud mr-2"></i>云端订单</h1>
                        <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="text-gray-600 text-2xl focus:outline-none p-1">
                            <i className={`fas ${isMobileMenuOpen ? 'fa-times' : 'fa-bars'}`}></i>
                        </button>
                    </div>

                    {/* 左侧侧边栏 */}
                    <div className={`${isMobileMenuOpen ? 'block' : 'hidden'} md:flex flex-col w-full md:w-64 bg-white shadow-lg z-20 absolute md:relative inset-0 md:inset-auto h-full pt-[60px] md:pt-0`}>
                        <div className="hidden md:block p-6 border-b border-gray-100">
                            <h1 className="text-xl font-bold text-indigo-600"><i className="fas fa-cloud mr-2"></i>云端订单</h1>
                        </div>
                        <nav className="flex-1 p-4 space-y-2 overflow-y-auto no-scrollbar">
                            <button onClick={() => handleTabChange('dashboard')} className={`w-full text-left px-4 py-3.5 rounded-xl flex items-center transition ${activeTab === 'dashboard' ? 'bg-indigo-50 text-indigo-600 font-bold' : 'text-gray-600 hover:bg-gray-50'}`}>
                                <i className="fas fa-chart-pie w-6 text-center mr-2"></i> 财务概览
                            </button>
                            <button onClick={() => handleTabChange('orders')} className={`w-full text-left px-4 py-3.5 rounded-xl flex items-center transition ${activeTab === 'orders' ? 'bg-indigo-50 text-indigo-600 font-bold' : 'text-gray-600 hover:bg-gray-50'}`}>

                                                            order.trackingNo ? (

                                                    <th className="p-4 font-medium">状态/物流</th>
                                                    <th className="p-4 font-medium text-right">操作</th>
                                                </tr>
                                            </thead>

                                                            </td>
                                                        </tr>
                                                    )
                                                })}
                                                {filteredAndSortedOrders.length === 0 && <tr><td colSpan="5" className="p-10 text-center text-gray-400">暂无符合条件的订单</td></tr>}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                                                    <p className="text-sm text-indigo-600 font-medium mb-2 font-mono"><i className="fas fa-phone-alt text-gray-300 mr-2 w-4 text-center"></i>{cust.phone}</p>
                                                    <p className="text-sm text-gray-600 leading-relaxed"><i className="fas fa-map-marker-alt text-gray-300 mr-2 w-4 text-center"></i>{cust.address}</p>
                                                </div>

                                        })}

                                                    <th className="p-4 font-medium">收件地址</th>
                                                    <th className="p-4 font-medium w-32">历史单量</th>
                                                    <th className="p-4 font-medium text-right">操作</th>
                                                </tr>
                                            </thead>
                                            <tbody className="text-sm">
                                                {customers.map(cust => {
                                                    const orderCount = orders.filter(o => o.customerId === cust.id).length;
                                                    return (
                                                        <tr key={cust.id} className="border-b border-gray-50 hover:bg-gray-50/50 transition">

                                                            <td className="p-4 text-gray-600">{cust.address}</td>
                                                            <td className="p-4"><span className="bg-gray-100 text-gray-600 px-2.5 py-1 rounded-full text-xs font-bold">{orderCount} 单</span></td>
                                                            <td className="p-4 text-right">
                                                                <button onClick={() => openEditCustomerModal(cust)} className="text-gray-600 hover:bg-gray-100 px-3 py-1.5 rounded-lg font-medium transition">编辑</button>
                                                            </td>
                                                        </tr>
                                                    )

                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                                <div className="flex justify-between items-center mb-6">

                                </div>
                                <form onSubmit={handleSaveCustomer} className="space-y-4">
                                    <div><label className="block text-sm font-bold text-gray-700 mb-1.5 ml-1">姓名</label><input required type="text" className="w-full bg-gray-50 border-0 rounded-xl p-3.5 text-base focus:ring-2 focus:ring-indigo-500 outline-none transition" placeholder="如: 王小明" value={customerForm.name} onChange={(e) => setCustomerForm({...customerForm, name: e.target.value})} /></div>

                                    <div className="pt-4 flex flex-col space-y-3 mt-4">

                                            confirmDeleteCustomer ? (
                                                <div className="w-full flex space-x-2"><button type="button" onClick={executeDeleteCustomer} className="flex-1 bg-red-500 text-white rounded-xl py-3.5 font-bold active:bg-red-600">确认删除</button><button type="button" onClick={() => setConfirmDeleteCustomer(false)} className="flex-1 bg-gray-100 text-gray-700 rounded-xl py-3.5 font-bold">取消</button></div>
                                            ) : (<button type="button" onClick={() => setConfirmDeleteCustomer(true)} className="w-full text-red-500 bg-red-50 rounded-xl py-3.5 font-bold active:bg-red-100 transition">删除联系人</button>)

                                    </div>
                                </form>
                            </div>
                        </div>

                                    <div className="pt-4 flex flex-col space-y-3 mt-4">
                                        <button type="submit" className="w-full bg-indigo-600 text-white rounded-xl py-3.5 text-base font-bold shadow-sm active:bg-indigo-700 transition">{editingProduct ? '保存修改' : '确认建档'}</button>

                                            confirmDeleteProduct ? (
                                                <div className="w-full flex space-x-2"><button type="button" onClick={executeDeleteProduct} className="flex-1 bg-red-500 text-white rounded-xl py-3.5 font-bold active:bg-red-600">确认删除</button><button type="button" onClick={() => setConfirmDeleteProduct(false)} className="flex-1 bg-gray-100 text-gray-700 rounded-xl py-3.5 font-bold">取消</button></div>
                                            ) : (<button type="button" onClick={() => setConfirmDeleteProduct(true)} className="w-full text-red-500 bg-red-50 rounded-xl py-3.5 font-bold active:bg-red-100 transition">删除商品</button>)
                                        )}

                        </div>

                                    </div>
                                </form>
                            </div>
                        </div>

                                <form onSubmit={handleSaveOrder} className="space-y-4">

                                            {products.map(p => (<option key={p.id} value={p.id} disabled={p.stock === 0 && (!editingOrder || editingOrder.productId !== p.id)}>{p.name} (剩: {p.stock}) {p.stock === 0 ? '⛔️缺货' : ''}</option>))}
                                        </select>

                                            {customers.map(c => <option key={c.id} value={c.id}>{c.name} - {c.phone}</option>)}
                                        </select>
                                    </div>
                                    <div className="flex space-x-3">
                                        <div className="flex-[3]"><label className="block text-sm font-bold text-gray-700 mb-1.5 ml-1">实收单价 (¥)</label><input required type="number" min="0" step="0.01" className="w-full bg-gray-50 border-0 rounded-xl p-3.5 text-base font-bold text-indigo-600 focus:ring-2 focus:ring-indigo-500 outline-none" value={orderForm.price} onChange={(e) => setOrderForm({...orderForm, price: e.target.value})} /></div>
                                        <div className="flex-[2]"><label className="block text-sm font-bold text-gray-700 mb-1.5 ml-1">数量</label><input required type="number" min="1" className="w-full bg-gray-50 border-0 rounded-xl p-3.5 text-base font-bold focus:ring-2 focus:ring-indigo-500 outline-none text-center" value={orderForm.quantity} onChange={(e) => setOrderForm({...orderForm, quantity: e.target.value})} /></div>
                                    </div>

                                    {/* 开单人字段 */}
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-1.5 ml-1">开单人 / 销售代表</label>
                                        <div className="relative">
                                            <i className="fas fa-user-edit absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                            <input required type="text" placeholder="输入您的名字" className="w-full bg-gray-50 border-0 rounded-xl py-3.5 pr-3.5 pl-10 text-base font-medium focus:ring-2 focus:ring-indigo-500 outline-none" value={orderForm.seller} onChange={(e) => setOrderForm({...orderForm, seller: e.target.value})} />
                                        </div>
                                    </div>
                                    
                                    <div className="bg-indigo-50/50 p-4 rounded-xl space-y-4 border border-indigo-50 mt-2">
                                        <div className="flex space-x-3">
                                            <div className="flex-1">
                                                <label className="block text-sm font-bold text-gray-700 mb-1.5 ml-1">收款状态</label>
                                                <select className="w-full bg-white border border-gray-200 rounded-xl p-3 text-base focus:ring-2 focus:ring-indigo-500 outline-none font-medium" value={orderForm.paymentStatus} onChange={(e) => setOrderForm({...orderForm, paymentStatus: e.target.value})}>
                                                    <option value="未收款">⏳ 未收款</option>
                                                    <option value="已收款">✅ 已收款</option>
                                                </select>
                                            </div>
                                            <div className="flex-1">
                                                <label className="block text-sm font-bold text-gray-700 mb-1.5 ml-1">发货状态</label>
                                                <select className="w-full bg-white border border-gray-200 rounded-xl p-3 text-base focus:ring-2 focus:ring-indigo-500 outline-none font-medium" value={orderForm.status} onChange={(e) => setOrderForm({...orderForm, status: e.target.value})}>
                                                    <option value="待发货">📦 待发货</option>
                                                    <option value="已发货">🚚 已发货</option>
                                                </select>
                                            </div>
                                        </div>
                                        {editingOrder && (
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-1.5 ml-1">运单号 (选填)</label>
                                                <input type="text" className="w-full bg-white border border-gray-200 rounded-xl p-3 text-base focus:ring-2 focus:ring-indigo-500 outline-none font-mono" placeholder="录入单号即自动发货" value={orderForm.trackingNo} onChange={(e) => setOrderForm({...orderForm, trackingNo: e.target.value})} />
                                            </div>
                                        )}
                                    </div>

                                    <div className="pt-6 flex flex-col space-y-3">
                                        <button type="submit" className="w-full bg-indigo-600 text-white rounded-xl py-3.5 text-base font-bold shadow-md active:bg-indigo-700 transition">
                                            {editingOrder ? '保存订单修改' : '生成订单并扣除库存'}
                                        </button>
                                        
                                        {editingOrder && (
                                            confirmDelete ? (
                                                <div className="w-full flex space-x-2"><button type="button" onClick={executeDeleteOrder} className="flex-1 bg-red-500 text-white rounded-xl py-3.5 font-bold active:bg-red-600">确认删除并退库存</button><button type="button" onClick={() => setConfirmDelete(false)} className="flex-1 bg-gray-100 text-gray-700 rounded-xl py-3.5 font-bold">取消</button></div>
                                            ) : (<button type="button" onClick={() => setConfirmDelete(true)} className="w-full text-red-500 bg-transparent border-2 border-red-100 rounded-xl py-3 font-bold active:bg-red-50 transition">废弃此订单</button>)
                                        )}
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                    
                    {/* CSS 动画定义 */}
                    <style dangerouslySetInnerHTML={{__html: `
                        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
                        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
                    `}} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
